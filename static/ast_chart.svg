<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>RPC log volume with and without AST optimization</title>
  <desc>Two scenarios showing log reduction with AST optimization. Broad filter: 12.6% reduction. Specific filter: 97.1% reduction.</desc>

  <style>
    .grid { stroke: rgba(128,128,128,0.2); }
    .axis-label { fill: rgba(128,128,128,0.8); }
    .scenario-label { fill: rgba(128,128,128,0.9); }
    .delta { fill: #4a9e4a; font-weight: 500; }
    .legend-label { fill: rgba(128,128,128,0.9); }
  </style>

  <!-- grid lines -->
  <line x1="80" y1="40" x2="560" y2="40" class="grid" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="90" x2="560" y2="90" class="grid" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="140" x2="560" y2="140" class="grid" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="190" x2="560" y2="190" class="grid" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="240" x2="560" y2="240" class="grid" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="290" x2="560" y2="290" class="grid" stroke-width="1"/>

  <!-- y axis labels -->
  <text x="72" y="294" text-anchor="end" font-size="11" class="axis-label">0</text>
  <text x="72" y="244" text-anchor="end" font-size="11" class="axis-label">10k</text>
  <text x="72" y="194" text-anchor="end" font-size="11" class="axis-label">20k</text>
  <text x="72" y="144" text-anchor="end" font-size="11" class="axis-label">30k</text>
  <text x="72" y="94" text-anchor="end" font-size="11" class="axis-label">40k</text>
  <text x="72" y="44" text-anchor="end" font-size="11" class="axis-label">50k</text>

  <!-- y axis line -->
  <line x1="80" y1="40" x2="80" y2="290" class="grid" stroke-width="1"/>

  <!-- y axis title -->
  <text x="16" y="165" text-anchor="middle" font-size="11" class="axis-label" transform="rotate(-90,16,165)">logs fetched from RPC</text>

  <!-- Scenario 1: All ERC-20 Transfers -->
  <rect x="130" y="117" width="60" height="173" fill="#E24B4A" opacity="0.85" rx="2"/>
  <rect x="210" y="136" width="60" height="154" fill="#378ADD" opacity="0.85" rx="2"/>
  <text x="160" y="110" text-anchor="middle" font-size="11" fill="#E24B4A">34,698</text>
  <text x="240" y="129" text-anchor="middle" font-size="11" fill="#378ADD">30,827</text>

  <!-- scenario 1 label -->
  <text x="200" y="320" text-anchor="middle" font-size="12" class="scenario-label">All ERC-20 Transfers</text>
  <text x="200" y="338" text-anchor="middle" font-size="11" class="axis-label">(all contracts, 2-event ABI)</text>
  <text x="200" y="358" text-anchor="middle" font-size="12" class="delta">−12.6%</text>

  <!-- Scenario 2: WETH Deposit -->
  <rect x="370" y="104" width="60" height="186" fill="#E24B4A" opacity="0.85" rx="2"/>
  <rect x="450" y="285" width="60" height="5" fill="#378ADD" opacity="0.85" rx="2"/>
  <text x="400" y="97" text-anchor="middle" font-size="11" fill="#E24B4A">37,150</text>
  <text x="480" y="278" text-anchor="middle" font-size="11" fill="#378ADD">1,078</text>

  <!-- scenario 2 label -->
  <text x="440" y="320" text-anchor="middle" font-size="12" class="scenario-label">WETH Deposit</text>
  <text x="440" y="338" text-anchor="middle" font-size="11" class="axis-label">(single contract, 4-event ABI)</text>
  <text x="440" y="358" text-anchor="middle" font-size="12" class="delta">−97.1%</text>

  <!-- legend -->
  <rect x="180" y="390" width="10" height="10" fill="#E24B4A" rx="2" opacity="0.85"/>
  <text x="196" y="399" font-size="12" class="legend-label">Baseline</text>
  <rect x="300" y="390" width="10" height="10" fill="#378ADD" rx="2" opacity="0.85"/>
  <text x="316" y="399" font-size="12" class="legend-label">AST-optimized</text>
</svg>
